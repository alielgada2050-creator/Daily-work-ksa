name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wasla
          POSTGRES_PASSWORD: wasla
          POSTGRES_DB: wasla_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wasla" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests (in-memory database)
        run: npm test
      - name: Tests (PostgreSQL 16)
        run: node --test --test-concurrency=1 test/*.test.js
        env:
          TEST_RESET_DB: '1'
          DATABASE_URL: postgres://wasla:wasla@localhost:5432/wasla_test
      - name: Architecture graph is valid
        run: node architecture/build-graph.js && git diff --exit-code architecture/graph.json
