services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: wasla
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: wasla
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "wasla"]
      interval: 5s
      retries: 10
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://wasla:${POSTGRES_PASSWORD:-change_me}@db:5432/wasla
    ports: ["127.0.0.1:3000:3000"]
    volumes: ["files:/app/storage"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
  files:
